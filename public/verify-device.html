<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบ Serial อุปกรณ์ - ระบบกล่องแจ้งเตือนการรับประทานยา</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand-custom" href="/dashboard.html">
        <div class="brand-icon">
          <i class="bi bi-box-seam-fill"></i>
        </div>
        <span>กล่องแจ้งเตือนยา</span>
      </a>
      <a href="/dashboard.html" class="btn btn-outline-custom btn-sm">
        <i class="bi bi-arrow-left me-1"></i> ย้อนกลับ
      </a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4">
          <div class="text-center mb-4">
            <div class="rounded-circle bg-light d-inline-flex p-3 mb-2 text-primary">
              <i class="bi bi-qr-code-scan fs-1"></i>
            </div>
            <h4 class="fw-bold">ผูกอุปกรณ์ด้วย Serial Number</h4>
            <p class="text-muted small">กรอกรหัสประจำเครื่อง ESP32 เพื่อผูกกับบัญชีของคุณ</p>
          </div>

          <div id="alertBox" class="d-none"></div>

          <form id="verifyDeviceForm" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="device_code" class="form-label fw-medium">Serial Number อุปกรณ์ ( Token )</label>
              <input type="text" id="device_code" name="device_code" class="form-control form-control-custom text-uppercase" placeholder="เช่น BOX-CEB123" required>
              <small class="text-muted">สามารถดู Serial Number ได้จากสติ๊กเกอร์ใต้กล่องยา</small>
            </div>

            <div class="mb-3">
              <label for="box_name" class="form-label fw-medium">ชื่อกล่องยา</label>
              <input type="text" id="box_name" name="box_name" class="form-control form-control-custom" placeholder="เช่น กล่องยาห้องนอน" value="กล่องยาของฉัน">
            </div>

            <div class="mb-3">
              <label for="location" class="form-label fw-medium">สถานที่วางกล่องยา</label>
              <input type="text" id="location" name="location" class="form-control form-control-custom" placeholder="เช่น ห้องนอน" value="ห้องนอน">
            </div>

            <div class="mb-3">
              <label for="medicine_name" class="form-label fw-medium">ชื่อยาประจำตัว</label>
              <input type="text" id="medicine_name" name="medicine_name" class="form-control form-control-custom" placeholder="เช่น พาราเซตามอล 500 mg" value="พาราเซตามอล 500 mg">
            </div>

            <div class="mb-4">
              <label for="medicine_image" class="form-label fw-medium">รูปภาพยา (ตัวเลือก)</label>
              <input type="file" id="medicine_image" name="medicine_image" class="form-control form-control-custom" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-2">
              <i class="bi bi-shield-check me-1"></i> ยืนยันผูกอุปกรณ์
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/verify-device.js"></script>
</body>
</html>
