<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - ระบบกล่องแจ้งเตือนการรับประทานยา</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand-icon">
          <i class="bi bi-bell-fill"></i>
        </div>
        <h4 class="fw-bold mb-1">กล่องแจ้งเตือนยา</h4>
        <p class="text-muted small">ไม่พลาดทุกเวลากา่รทานยา ดูแลสุขภาพของคุณทุกวัน</p>
      </div>

      <div id="alertBox" class="d-none"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="username" class="form-label text-muted small fw-medium">ชื่อผู้ใช้ หรือ อีเมล</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
            <input type="text" id="username" class="form-control form-control-custom border-start-0" placeholder="example@email.com" required>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label text-muted small fw-medium">รหัสผ่าน</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
            <input type="password" id="password" class="form-control form-control-custom border-start-0" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 mb-3">
          <i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ
        </button>

        <div class="text-center mt-3">
          <span class="text-muted small">ยังไม่มีบัญชี? </span>
          <a href="/register.html" class="text-primary fw-medium text-decoration-none small">สมัครสมาชิก</a>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
