<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประวัติการหยิบยา - ระบบกล่องแจ้งเตือนการรับประทานยา</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand-custom" href="/dashboard.html">
        <div class="brand-icon">
          <i class="bi bi-box-seam-fill"></i>
        </div>
        <span>กล่องแจ้งเตือนยา</span>
      </a>
      <a href="/dashboard.html" class="btn btn-outline-custom btn-sm">
        <i class="bi bi-arrow-left me-1"></i> ย้อนกลับไปหน้าหลัก
      </a>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div>
        <h4 class="fw-bold mb-1"><i class="bi bi-clock-history text-primary me-2"></i>ประวัติการหยิบขวดยา</h4>
        <p class="text-muted small mb-0">ระบบจัดเก็บและแสดง 100 ประวัติล่าสุดต่อกล่องยา</p>
      </div>

      <!-- Filters -->
      <div class="d-flex flex-wrap gap-2">
        <select id="statusFilter" class="form-select form-control-custom" style="min-width: 170px;">
          <option value="">ทั้งหมดทุกสถานะ</option>
          <option value="Taken">ทานยาแล้ว</option>
          <option value="Taken Early">ทานยาก่อนเวลา</option>
          <option value="Missed">ยังไม่รับประทานยา</option>
        </select>
        <select id="boxFilter" class="form-select form-control-custom" style="min-width: 180px;">
          <option value="">ทั้งหมดทุกกล่องยา</option>
        </select>
      </div>
    </div>

    <div class="card card-custom p-0 overflow-hidden">
      <div class="table-responsive">
        <table class="table table-custom mb-0">
          <thead>
            <tr>
              <th>วันที่</th>
              <th>รอบเวลาที่ตั้งเตือน</th>
              <th>เวลาที่บันทึก / หยิบจริง</th>
              <th>กล่องยา / สถานที่</th>
              <th>ชื่อยา</th>
              <th>สถานะการรับประทาน</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <!-- Dynamic History Rows -->
          </tbody>
        </table>
      </div>

      <div id="emptyHistory" class="p-5 text-center d-none">
        <i class="bi bi-inbox text-muted display-4 mb-2"></i>
        <h6 class="text-muted">ยังไม่มีประวัติการหยิบยาในช่วงเวลาที่เลือก</h6>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/history.js"></script>
</body>
</html>
