<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการโปรไฟล์ - ระบบกล่องแจ้งเตือนการรับประทานยา</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand-custom" href="/dashboard.html">
        <div class="brand-icon">
          <i class="bi bi-box-seam-fill"></i>
        </div>
        <span>กล่องแจ้งเตือนยา</span>
      </a>
      <button type="button" id="backToPreviousPage" class="btn btn-outline-custom btn-sm">
        <i class="bi bi-arrow-left me-1"></i> ย้อนกลับ
      </button>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card card-custom p-4">
          <div class="d-flex align-items-center gap-3 mb-4">
            <div class="brand-icon" style="width: 54px; height: 54px; font-size: 1.5rem;">
              <i class="bi bi-person-fill"></i>
            </div>
            <div>
              <h4 class="fw-bold mb-0">จัดการโปรไฟล์ผู้ใช้งาน</h4>
              <span id="role_badge" class="badge bg-light text-primary border">ผู้ดูแลผู้ป่วย (Caregiver)</span>
            </div>
          </div>

          <div id="alertBox" class="d-none"></div>

          <form id="profileForm">
            <div class="mb-3">
              <label for="username" class="form-label text-muted small fw-medium">ชื่อผู้ใช้ (Username)</label>
              <input type="text" id="username" class="form-control form-control-custom bg-light" readonly>
            </div>

            <div class="mb-3">
              <label for="full_name" class="form-label text-muted small fw-medium">ชื่อ - นามสกุล</label>
              <input type="text" id="full_name" class="form-control form-control-custom" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label text-muted small fw-medium">อีเมล</label>
              <input type="email" id="email" class="form-control form-control-custom" required>
            </div>

            <hr class="my-4">
            <h6 class="fw-bold mb-3 text-primary"><i class="bi bi-key me-2"></i>เปลี่ยนรหัสผ่าน (เว้นว่างไว้หากไม่ต้องการเปลี่ยน)</h6>

            <div class="mb-3">
              <label for="new_password" class="form-label text-muted small fw-medium">รหัสผ่านใหม่</label>
              <div class="input-group">
                <input type="password" id="new_password" class="form-control form-control-custom" placeholder="อย่างน้อย 6 ตัวอักษร">
                <button type="button" class="btn btn-outline-secondary" data-toggle-password="new_password" aria-label="แสดงรหัสผ่าน">
                  <i class="bi bi-eye-slash"></i>
                </button>
              </div>
            </div>

            <div class="mb-4">
              <label for="confirm_password" class="form-label text-muted small fw-medium">ยืนยันรหัสผ่านใหม่</label>
              <div class="input-group">
                <input type="password" id="confirm_password" class="form-control form-control-custom" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง">
                <button type="button" class="btn btn-outline-secondary" data-toggle-password="confirm_password" aria-label="แสดงรหัสผ่าน">
                  <i class="bi bi-eye-slash"></i>
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 flex-wrap">
              <button type="button" id="cancelProfileBtn" class="btn btn-outline-custom">ยกเลิก</button>
              <button type="submit" class="btn btn-primary-custom px-4">
                <i class="bi bi-save me-1"></i> บันทึกข้อมูล
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
